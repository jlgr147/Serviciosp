<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Profesional</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    margin:0;
    padding:15px;
}
.container{
    background:white;
    padding:20px;
    border-radius:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}
input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
    width:100%;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
}
button:hover{opacity:.9;}
.card{
    background:#1f1f1f;
    color:white;
    padding:15px;
    border-radius:20px;
    margin-top:20px;
    position:relative;
}
.delete-btn{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
    font-size:18px;
    color:#ff4f4f;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
th,td{
    padding:6px;
    text-align:center;
    font-size:14px;
}
th{background:#2a5298;}
.valor{color:#ff4fa3;font-weight:bold;}
.total{margin-top:10px;font-weight:bold;}
.correcto{color:green;font-weight:bold;}
.error{color:red;font-weight:bold;}
@media(max-width:768px){
    table{font-size:12px;}
}
</style>
</head>
<body>

<div class="container">

<h2>Agregar Servicio</h2>

<div class="form-grid">
<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="valor" placeholder="Valor total servicio">
<input type="date" id="fecha">

<select id="representante">
<option>Jorge Garzón</option>
<option>Jorge Balero</option>
<option>Arturo Castro</option>
<option>Ismael Garzón</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad personas">

<button onclick="agregarServicio()">Agregar</button>
</div>

<br>
<button onclick="exportarExcel()">Exportar a Excel</button>

<h3>Total Servicios Ingresados: $ <span id="totalServicios">0</span></h3>
<h3>Total Servicios Distribuidos: $ <span id="totalDistribuido">0</span></h3>
<div id="estado-cuadre"></div>

<div id="tarjetas"></div>

</div>

<script>

let datos = []
let idCounter = 0

function formatear(n){
    return Math.round(n).toLocaleString("es-CO")
}

function aproximarCien(valor){
    if(valor % 100 === 0) return valor
    return Math.round(valor/100)*100
}

function agregarServicio(){

    let nombre = servicio.value
    let valor = parseFloat(valorInput.value)
    let fecha = fechaInput.value
    let rep = representante.value
    let cantidad = parseFloat(cantidadInput.value)

    if(!valor || !fecha || !cantidad){
        alert("Complete los datos")
        return
    }

    datos.push({
        id:idCounter++,
        nombre,valor,fecha,rep,cantidad,
        ajusteActivo:false,
        nombreAjuste:"",
        valorAjuste:0
    })

    render()
}

function eliminarServicio(id){
    datos = datos.filter(d=>d.id!==id)
    render()
}

function render(){

    let contenedor = document.getElementById("tarjetas")
    contenedor.innerHTML=""

    let reps = [...new Set(datos.map(d=>d.rep))]
    let totalServicios=0
    let totalDistribuido=0

    reps.forEach(rep=>{

        let serviciosRep = datos.filter(d=>d.rep===rep)

        let card = document.createElement("div")
        card.className="card"

        let html=`<div class="delete-btn" onclick="eliminarRepresentante('${rep}')">✖</div>
        <h3>${rep}</h3>
        <table>
        <tr>
        <th>Servicio</th>
        <th>Valor</th>
        <th>Personas</th>
        <th>Valor Distr</th>
        </tr>`

        let totalPersona=0

        serviciosRep.forEach(s=>{

            let totalPersonasServicio =
                datos.filter(d=>d.nombre===s.nombre)
                     .reduce((a,b)=>a+b.cantidad,0)

            let valorUnitario = s.valor / totalPersonasServicio
            let valorDistribuido = valorUnitario * s.cantidad
            valorDistribuido = aproximarCien(valorDistribuido)

            totalPersona += valorDistribuido + (s.ajusteActivo ? s.valorAjuste : 0)
            totalServicios += s.valor
            totalDistribuido += valorDistribuido + (s.ajusteActivo ? s.valorAjuste : 0)

            html+=`
            <tr>
            <td>${s.nombre}</td>
            <td>$ ${formatear(s.valor)}</td>
            <td>${s.cantidad}</td>
            <td class="valor">$ ${formatear(valorDistribuido)}</td>
            </tr>

            <tr>
            <td colspan="4">
            <label>
            <input type="checkbox"
            onchange="toggleAjuste(${s.id},this.checked)">
            Aplicar ajuste
            </label>

            <div id="ajuste-${s.id}" style="display:${s.ajusteActivo?'block':'none'}">
            <input type="text" placeholder="Nombre ajuste"
            onchange="cambiarNombreAjuste(${s.id},this.value)">
            <input type="number" placeholder="Valor ajuste"
            onchange="cambiarValorAjuste(${s.id},this.value)">
            </div>

            <button onclick="eliminarServicio(${s.id})">Eliminar</button>

            </td>
            </tr>
            `
        })

        html+=`</table>
        <div class="total">
        Total a pagar: $ ${formatear(totalPersona)}
        </div>`

        card.innerHTML=html
        contenedor.appendChild(card)
    })

    document.getElementById("totalServicios").innerText=formatear(totalServicios)
    document.getElementById("totalDistribuido").innerText=formatear(totalDistribuido)

    validarCuadre(totalServicios,totalDistribuido)
}

function toggleAjuste(id,estado){
    let item = datos.find(d=>d.id===id)
    item.ajusteActivo = estado
    render()
}

function cambiarNombreAjuste(id,valor){
    let item = datos.find(d=>d.id===id)
    item.nombreAjuste = valor
}

function cambiarValorAjuste(id,valor){
    let item = datos.find(d=>d.id===id)
    item.valorAjuste = parseFloat(valor)||0
    render()
}

function validarCuadre(totalServicios,totalDistribuido){
    let estado = document.getElementById("estado-cuadre")
    let diferencia = totalDistribuido-totalServicios
    if(diferencia===0){
        estado.innerHTML="✅ Cuadre Perfecto"
        estado.className="correcto"
    }else{
        estado.innerHTML=`⚠ Diferencia: $ ${formatear(diferencia)}`
        estado.className="error"
    }
}

function eliminarRepresentante(rep){
    datos = datos.filter(d=>d.rep!==rep)
    render()
}

function exportarExcel(){

    let data=[]

    datos.forEach(d=>{
        data.push({
            Representante:d.rep,
            Servicio:d.nombre,
            Valor_Total:d.valor,
            Personas:d.cantidad,
            Ajuste:d.ajusteActivo?d.valorAjuste:0
        })
    })

    const ws = XLSX.utils.json_to_sheet(data)
    const wb = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(wb, ws, "Distribución")
    XLSX.writeFile(wb,"distribucion_recibos.xlsx")
}

const servicio=document.getElementById("servicio")
const valorInput=document.getElementById("valor")
const fechaInput=document.getElementById("fecha")
const representante=document.getElementById("representante")
const cantidadInput=document.getElementById("cantidad")

</script>

</body>
</html>
