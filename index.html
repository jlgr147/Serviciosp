
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Servicios</title>

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial, sans-serif;
  margin:0;
  padding:20px;
}

h2{margin-top:40px;}

input, select{
  padding:8px;
  border-radius:6px;
  border:none;
  margin:4px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#00b894;
  color:white;
}

button:hover{opacity:0.8;}

.card{
  background:#1e1e1e;
  padding:20px;
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

th,td{
  padding:6px;
  text-align:center;
  font-size:14px;
}

th{
  background:#333;
}

.valorFactura{
  color:#ccc;
}

.valorDistribuido{
  color:#00cec9;
}

.total{
  font-size:20px;
  font-weight:bold;
  color:#00ff99;
}

.x{
  color:red;
  cursor:pointer;
  font-size:12px;
}

.resumen{
  margin-top:30px;
  padding:20px;
  background:#1e1e1e;
  border-radius:10px;
}

@media(max-width:768px){
  table{font-size:12px;}
}
</style>
</head>
<body>

<h2>Agregar Responsable</h2>
<input id="nombreResp" placeholder="Nombre responsable">
<input id="cantResp" type="number" placeholder="Cantidad personas">
<button onclick="agregarResponsable()">Agregar</button>

<div id="listaResp"></div>

<h2>Agregar Servicio</h2>
<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>Aseo</option>
<option>Seguro</option>
<option>Netflix - YouTube</option>
</select>

<input id="valorServicio" type="number" placeholder="Valor servicio">
<input id="fechaPago" type="date">

<div id="distribucionInputs"></div>

<button onclick="agregarServicio()">Agregar Servicio</button>

<div id="tarjetas"></div>

<div class="resumen">
<h3>Resumen General</h3>
<p>Total Servicios Ingresados: <span id="totalFactura">$0</span></p>
<p>Total Distribuido: <span id="totalDistribuido">$0</span></p>
<p>Total Ajustes: <span id="totalAjustes">$0</span></p>
</div>

<script>

let responsables=[];
let servicios=[];
let ajustesGlobal=0;

function formato(n){
 return "$"+Math.round(n).toLocaleString("es-CO");
}

function agregarResponsable(){
 const nombre=document.getElementById("nombreResp").value;
 const cant=Math.round(parseFloat(document.getElementById("cantResp").value)||0);

 if(!nombre || cant<=0) return;

 responsables.push({nombre,cantidad:cant});
 document.getElementById("nombreResp").value="";
 document.getElementById("cantResp").value="";
 renderResponsables();
}

function renderResponsables(){
 let html="<ul>";
 responsables.forEach(r=>{
   html+=`<li>${r.nombre} - ${r.cantidad} personas</li>`;
 });
 html+="</ul>";
 document.getElementById("listaResp").innerHTML=html;

 let inputs="";
 responsables.forEach((r,i)=>{
   inputs+=`${r.nombre}: <input type="number" id="dist_${i}" placeholder="Personas que aplican"><br>`;
 });
 document.getElementById("distribucionInputs").innerHTML=inputs;
}

function agregarServicio(){
 const nombre=document.getElementById("servicio").value;
 const valor=parseFloat(document.getElementById("valorServicio").value)||0;
 const fecha=document.getElementById("fechaPago").value;

 if(valor<=0 || !fecha) return;

 let totalPersonas=0;
 let distribucion=[];

 responsables.forEach((r,i)=>{
   let p=Math.round(parseFloat(document.getElementById("dist_"+i).value)||0);
   if(p>0){
     distribucion.push({responsable:r.nombre,personas:p});
     totalPersonas+=p;
   }
 });

 if(totalPersonas===0) return;

 servicios.push({nombre,valor,fecha,distribucion,totalPersonas});
 document.getElementById("valorServicio").value="";
 renderTarjetas();
}

function renderTarjetas(){
 let html="";
 let totalFactura=0;
 let totalDistribuido=0;
 ajustesGlobal=0;

 responsables.forEach(r=>{
   let filas="";
   let totalPersona=0;

   servicios.forEach((s,index)=>{
     let dist=s.distribucion.find(d=>d.responsable===r.nombre);
     if(dist){
       let unit=s.valor/s.totalPersonas;
       let valorDist=unit*dist.personas;
       totalPersona+=valorDist;
       totalDistribuido+=valorDist;

       filas+=`
       <tr>
         <td>${s.nombre}</td>
         <td class="valorFactura">${formato(s.valor)}</td>
         <td>${dist.personas}</td>
         <td class="valorDistribuido">${formato(valorDist)}</td>
         <td><span class="x" onclick="eliminarDistribucion(${index},'${r.nombre}')">x</span></td>
       </tr>`;
     }
   });

   totalFactura=servicios.reduce((acc,s)=>acc+s.valor,0);

   let idAjuste="ajuste_"+r.nombre.replace(/\s/g,"");
   let idValor="valor_"+r.nombre.replace(/\s/g,"");

   html+=`
   <div class="card">
     <h3>${r.nombre}</h3>
     <p>Fecha límite: ${
        servicios.length>0 ? 
        new Date(servicios[0].fecha).toLocaleDateString("es-CO") 
        : "-"
     }</p>

     <table>
       <tr>
         <th>Servicio</th>
         <th>Valor Factura</th>
         <th>Personas</th>
         <th>Valor Distribuido</th>
         <th></th>
       </tr>
       ${filas}
     </table>

     <br>
     <input type="checkbox" id="${idAjuste}" onchange="toggleAjuste('${r.nombre}')"> 
     <label style="font-size:12px;">Ajuste</label>

     <div id="campo_${r.nombre.replace(/\s/g,"")}" style="display:none;">
       <input placeholder="Concepto ajuste" id="concepto_${r.nombre}">
       <input type="number" placeholder="Valor" id="${idValor}">
       <button onclick="aplicarAjuste('${r.nombre}')">Agregar</button>
     </div>

     <p class="total">Total a pagar: ${formato(Math.round(totalPersona/100)*100)}</p>
   </div>`;
 });

 document.getElementById("tarjetas").innerHTML=html;
 document.getElementById("totalFactura").innerText=formato(totalFactura);
 document.getElementById("totalDistribuido").innerText=formato(totalDistribuido);
 document.getElementById("totalAjustes").innerText=formato(ajustesGlobal);
}

function eliminarDistribucion(index,nombre){
 let s=servicios[index];
 s.distribucion=s.distribucion.filter(d=>d.responsable!==nombre);
 renderTarjetas();
}

function toggleAjuste(nombre){
 let campo=document.getElementById("campo_"+nombre.replace(/\s/g,""));
 let check=document.getElementById("ajuste_"+nombre.replace(/\s/g,""));
 campo.style.display=check.checked?"block":"none";
}

function aplicarAjuste(nombre){
 let valor=parseFloat(document.getElementById("valor_"+nombre.replace(/\s/g,"")).value)||0;
 ajustesGlobal+=valor;
 renderTarjetas();
}

</script>

</body>
</html>
