<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Servicios</title>

<!-- SheetJS para exportar Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial, sans-serif;
  margin:0;
  padding:20px;
}
h2{margin-top:40px;}
input, select{
  padding:8px;
  border-radius:6px;
  border:none;
  margin:4px;
  width:100%;
}
button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#00b894;
  color:white;
}
button:hover{opacity:0.8;}
.card{
  background:#1e1e1e;
  padding:20px;
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}
table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}
th,td{
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{background:#333;}
.valorFactura{color:#aaa;}
.valorDistribuido{color:#00cec9;}
.total{font-size:20px;font-weight:bold;color:#00ff99;}
.fecha{color:red;font-weight:bold;}
.x{color:red;cursor:pointer;font-size:14px;margin-left:10px;}
.resumen{margin-top:30px;padding:20px;background:#1e1e1e;border-radius:10px;}
.correcto{color:#00ff99;}
.error{color:red;}
@media(max-width:768px){table{font-size:12px;}}
</style>
</head>
<body>

<h2>Agregar Responsable</h2>
<input id="nombreResp" placeholder="Nombre responsable">
<button onclick="agregarResponsable()">Agregar</button>
<div id="listaResp"></div>

<h2>Agregar Servicio</h2>
<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>Aseo</option>
<option>Seguro</option>
<option>Netflix - YouTube</option>
</select>
<input id="valorServicio" type="number" placeholder="Valor servicio">
<input id="fechaPago" type="date" placeholder="Fecha límite">

<div id="distribucionInputs"></div>
<button onclick="agregarServicio()">Agregar Servicio</button>

<h2>Servicios Acumulados</h2>
<div id="listaServicios"></div>

<h2>Distribución de Servicios</h2>
<div id="tarjetas"></div>

<div class="resumen">
<h3>Resumen General</h3>
<p>Total Servicios Ingresados: <span id="totalFactura">$0</span></p>
<p>Total Distribuido: <span id="totalDistribuido">$0</span></p>
<p>Total AJT: <span id="totalAjustes">$0</span></p>
<p id="validacion"></p>
<button onclick="exportarExcel()">📊 Exportar a Excel</button>
</div>

<script>
let responsables=[];
let servicios=[];
let ajustes={};

// Cargar datos guardados
if(localStorage.getItem("responsables")) responsables=JSON.parse(localStorage.getItem("responsables"));
if(localStorage.getItem("servicios")) servicios=JSON.parse(localStorage.getItem("servicios"));
if(localStorage.getItem("ajustes")) ajustes=JSON.parse(localStorage.getItem("ajustes"));

function guardarLocal(){
  localStorage.setItem("responsables", JSON.stringify(responsables));
  localStorage.setItem("servicios", JSON.stringify(servicios));
  localStorage.setItem("ajustes", JSON.stringify(ajustes));
}

function formato(n){ return "$"+Math.round(n).toLocaleString("es-CO"); }
function redondearArriba100(n){ return Math.ceil(n/100)*100; }

// Evitar recarga accidental
window.addEventListener("beforeunload", function (e) {
  e.preventDefault();
  e.returnValue = '';
});

// ==================== RESPONSABLES ====================
function agregarResponsable(){
 const nombre=document.getElementById("nombreResp").value.trim();
 if(!nombre) return;
 responsables.push(nombre);
 document.getElementById("nombreResp").value="";
 renderResponsables();
 renderTarjetas();
 guardarLocal();
}

function eliminarResponsable(index){
 if(!confirm("¿Seguro que desea eliminar este responsable y sus distribuciones?")) return;
 let nombre=responsables[index];
 responsables.splice(index,1);
 delete ajustes[nombre];
 servicios.forEach(s=>{
   s.distribucion=s.distribucion.filter(d=>d.responsable!==nombre);
 });
 renderResponsables();
 renderTarjetas();
 guardarLocal();
}

function renderResponsables(){
 let html="<ul>";
 responsables.forEach((r,i)=> 
  html+=`<li>${r} <span class="x" onclick="eliminarResponsable(${i})">x</span></li>`
 );
 html+="</ul>";
 document.getElementById("listaResp").innerHTML=html;

 let inputs="";
 responsables.forEach((r,i)=>{
   inputs+=`${r}: 
   <input type="number" step="any" id="dist_${i}" placeholder="Personas que aplican"><br>`;
 });
 document.getElementById("distribucionInputs").innerHTML=inputs;
}

// ==================== SERVICIOS ====================
function agregarServicio(){
 const nombre=document.getElementById("servicio").value;
 const valor=parseFloat(document.getElementById("valorServicio").value)||0;
 const fecha=document.getElementById("fechaPago").value;

 if(servicios.some(s=>s.nombre===nombre)){
   alert("Ese servicio ya fue ingresado");
   return;
 }
 if(valor<=0 || !fecha) return;

 let totalPersonas=0;
 let distribucion=[];
 responsables.forEach((r,i)=>{
   let p=parseFloat(document.getElementById("dist_"+i).value)||0;
   if(p>0){
     distribucion.push({responsable:r,personas:p});
     totalPersonas+=p;
   }
 });

 if(!Number.isInteger(totalPersonas)){
   alert("La suma total de personas debe ser un número entero");
   return;
 }
 if(totalPersonas===0){
   alert("Debe asignar personas");
   return;
 }

 servicios.push({nombre,valor,fecha,distribucion,totalPersonas});
 renderServicios();
 renderTarjetas();
 guardarLocal();
}

function renderServicios(){
 let html="";
 servicios.forEach((s,i)=>{
   let personasTotales = s.totalPersonas;
   html+=`<div class="card">
     ${s.nombre} - ${formato(s.valor)} - Personas: ${personasTotales}
     <span class="x" onclick="if(confirm('¿Seguro que desea eliminar este servicio?')) eliminarServicio(${i})">x</span>
   </div>`;
 });
 document.getElementById("listaServicios").innerHTML=html;
}

function eliminarServicio(index){
 servicios.splice(index,1);
 renderServicios();
 renderTarjetas();
 guardarLocal();
}

// ==================== DISTRIBUCIONES ====================
function eliminarDistribucion(servIndex,nombre){
 if(!confirm("¿Seguro que desea eliminar esta distribución?")) return;
 let s=servicios[servIndex];
 s.distribucion=s.distribucion.filter(d=>d.responsable!==nombre);
 renderTarjetas();
 guardarLocal();
}

function aplicarAJT(nombre){
 const concepto=document.getElementById("concepto_"+nombre).value;
 const valor=parseFloat(document.getElementById("valor_"+nombre).value)||0;
 if(!valor) return;

 if(!ajustes[nombre]) ajustes[nombre]=[];
 ajustes[nombre].push({concepto,valor});

 document.getElementById("concepto_"+nombre).value="";
 document.getElementById("valor_"+nombre).value="";
 renderTarjetas();
 guardarLocal();
}

function eliminarAJT(nombre,index){
 ajustes[nombre].splice(index,1);
 renderTarjetas();
 guardarLocal();
}

// ==================== RENDER TARJETAS ====================
function renderTarjetas(){
 let html="";
 let totalFactura=servicios.reduce((acc,s)=>acc+s.valor,0);
 let totalDistribuido=0;
 let totalAJT=0;

 let mesActual = new Date().toLocaleString("es-CO",{month:"long",year:"numeric"});

 responsables.forEach(r=>{
   let filas="";
   let totalPersona=0;

   servicios.forEach((s,index)=>{
     let dist=s.distribucion.find(d=>d.responsable===r);
     if(dist){
       let unit=s.valor/s.totalPersonas;
       let valorDist=unit*dist.personas;
       totalPersona+=valorDist;
       totalDistribuido+=valorDist;

       filas+=`<tr>
         <td>${s.nombre}</td>
         <td class="valorFactura">${formato(s.valor)}</td>
         <td>${Math.round(dist.personas)}</td>
         <td class="valorDistribuido">${formato(valorDist)}</td>
         <td><span class="x" onclick="eliminarDistribucion(${index},'${r}')">x</span></td>
       </tr>`;
     }
   });

   let ajusteLista=ajustes[r]||[];
   ajusteLista.forEach((a,i)=>{
     totalPersona+=a.valor;
     totalAJT+=a.valor;
     filas+=`<tr>
       <td colspan="3">AJT: ${a.concepto}</td>
       <td class="valorDistribuido">${formato(a.valor)}</td>
       <td><span class="x" onclick="eliminarAJT('${r}',${i})">x</span></td>
     </tr>`;
   });

   html+=`<div class="card">
     <h3>${r}</h3>
     <h4>Facturas Mes: ${mesActual}</h4>
     <p class="fecha">Pagar antes de: ${
       servicios.length>0 ? new Date(servicios[0].fecha).toLocaleDateString("es-CO") : "-"
     }</p>

     <table>
       <tr>
         <th>Servicio</th>
         <th>Valor</th>
         <th>Personas</th>
         <th>Valor Distr.</th>
         <th></th>
       </tr>
       ${filas}
     </table>

     <br>
     <input type="checkbox" onchange="document.getElementById('aj_${r}').style.display=this.checked?'block':'none'">
     <label style="font-size:12px;"> AJT</label>

     <div id="aj_${r}" style="display:none;">
       <input id="concepto_${r}" placeholder="Concepto AJT">
       <input type="number" id="valor_${r}" placeholder="Valor AJT">
       <button onclick="aplicarAJT('${r}')">Agregar</button>
     </div>

     <p class="total">Total a pagar: ${formato(redondearArriba100(totalPersona))}</p>
   </div>`;
 });

 document.getElementById("tarjetas").innerHTML=html;
 document.getElementById("totalFactura").innerText=formato(totalFactura);
 document.getElementById("totalDistribuido").innerText=formato(totalDistribuido);
 document.getElementById("totalAjustes").innerText=formato(totalAJT);

 let valid=document.getElementById("validacion");
 if(Math.round(totalFactura)===Math.round(totalDistribuido)){
   valid.innerHTML="✔ Distribución correcta";
   valid.className="correcto";
 }else{
   valid.innerHTML="❌ Diferencia detectada";
   valid.className="error";
 }
}

// ==================== EXPORTAR EXCEL ====================
function exportarExcel(){
  if(servicios.length===0){ alert("No hay servicios para exportar"); return; }

  let filas=[];
  let fechaBase = servicios.length>0 ? new Date(servicios[0].fecha) : new Date();
  let año = fechaBase.getFullYear();
  let mes = fechaBase.toLocaleString("es-CO",{month:"long"});

  servicios.forEach(servicio=>{
    servicio.distribucion.forEach(dist=>{
      let unit = servicio.valor / servicio.totalPersonas;
      let valorPagar = unit * dist.personas;

      filas.push({
        "Año": año,
        "Mes": mes,
        "Nombre del servicio": servicio.nombre,
        "Valor del servicio": Math.round(servicio.valor),
        "Personas totales": servicio.totalPersonas,
        "Responsable": dist.responsable,
        "Personas por responsable": dist.personas,
        "Valor a pagar servicio": Math.round(valorPagar)
      });
    });
  });

  let wb = XLSX.utils.book_new();
  let ws = XLSX.utils.json_to_sheet(filas);
  XLSX.utils.book_append_sheet(wb, ws, "DistribucionServicios");
  XLSX.writeFile(wb, `Distribucion_${mes}_${año}.xlsx`);
}

// ==================== INICIAL ====================
renderResponsables();
renderServicios();
renderTarjetas();
</script>

</body>
</html>
