<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Servicios</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    padding:20px;
    display:flex;
    justify-content:center;
}
.container{
    background:white;
    padding:25px;
    border-radius:20px;
    width:100%;
    max-width:1100px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
h1{text-align:center;}

input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
}
button:hover{opacity:0.9;}

.card{
    background:#1f1f1f;
    color:white;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card h3{
    margin-bottom:10px;
}

.line{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}

.valor{
    color:#ff4fa3;
    font-weight:bold;
}

.total{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.fecha{
    margin-top:10px;
    font-size:14px;
    color:#00ffb3;
}

.correcto{color:green;font-weight:bold;}
.error{color:red;font-weight:bold;}
</style>
</head>
<body>

<div class="container">

<h1>Distribución Dinámica</h1>

<h3>Agregar Servicio</h3>

<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="valor" placeholder="Valor total servicio">
<input type="number" id="cantidad" placeholder="Cantidad personas/pisos" step="0.01">
<input type="date" id="fecha">

<button onclick="agregarServicio()">Agregar</button>

<label>
<input type="checkbox" id="redondear"> Redondear al 100 más cercano
</label>

<h2>Tarjetas por Persona / Piso</h2>
<div id="distribucion"></div>

<h2>Total General: $ <span id="totalGeneral">0</span></h2>
<div id="mensaje"></div>

</div>

<script>

let servicios = [];

function agregarServicio(){

    let nombre = document.getElementById("servicio").value;
    let valor = parseFloat(document.getElementById("valor").value);
    let cantidad = parseFloat(document.getElementById("cantidad").value);
    let fecha = document.getElementById("fecha").value;

    if(!valor || !cantidad || !fecha){
        alert("Complete todos los campos");
        return;
    }

    servicios.push({nombre,valor,cantidad,fecha});
    distribuir();
}

function distribuir(){

    let contenedor = document.getElementById("distribucion");
    contenedor.innerHTML="";
    let totalGeneral=0;
    let sumaDistribuida=0;

    servicios.forEach(s=>{

        let valorPersona = s.valor / s.cantidad;

        if(document.getElementById("redondear").checked){
            valorPersona = Math.round(valorPersona/100)*100;
        }

        for(let i=1;i<=s.cantidad;i++){

            let card = document.createElement("div");
            card.className="card";

            card.innerHTML=`
            <h3>${s.nombre} - Persona/Piso ${i}</h3>

            <div class="line">
                <span>Valor general servicio</span>
                <span class="valor">$ ${s.valor.toLocaleString()}</span>
            </div>

            <div class="line">
                <span>C.Persona/Piso</span>
                <span>${i}</span>
            </div>

            <div class="line">
                <span>Valor por persona</span>
                <span class="valor">$ ${valorPersona.toLocaleString()}</span>
            </div>

            <div class="line">
                <span>Total servicio distribuido</span>
                <span>$ ${(valorPersona*s.cantidad).toLocaleString()}</span>
            </div>

            <div class="total">
                Total a pagar: $ ${valorPersona.toLocaleString()}
            </div>

            <div class="fecha">
                Pagar antes de: ${s.fecha}
            </div>
            `;

            contenedor.appendChild(card);

            totalGeneral+=valorPersona;
            sumaDistribuida+=valorPersona;
        }
    });

    document.getElementById("totalGeneral").innerText=totalGeneral.toLocaleString();

    let totalReal = servicios.reduce((a,b)=>a+b.valor,0);

    if(totalReal === sumaDistribuida){
        document.getElementById("mensaje").innerHTML="<div class='correcto'>Distribución correcta ✅</div>";
    }else{
        document.getElementById("mensaje").innerHTML="<div class='error'>Hay diferencia en la distribución ⚠</div>";
    }

}

</script>

</body>
</html>
