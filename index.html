<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Distribución Servicios</title>

<style>

body{
background:#111;
color:#fff;
font-family:Arial;
margin:0;
padding:20px;
}

h2{
margin-top:40px;
text-align:center;
}

input,select{
padding:10px;
border-radius:6px;
border:none;
margin:5px 0;
width:100%;
font-size:16px;
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
cursor:pointer;
background:#00b894;
color:white;
margin-top:5px;
}

.card{
background:#1e1e1e;
padding:20px;
margin:20px auto;
border-radius:16px;
max-width:420px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
font-size:16px;
}

th,td{
padding:8px;
text-align:center;
}

th{
background:#333;
}

.valorFactura{
color:#aaa;
}

.valorDistribuido{
color:#00cec9;
}

.total{
font-size:22px;
font-weight:bold;
color:#00ff99;
margin-top:10px;
}

.fecha{
color:red;
font-weight:bold;
}

.x{
color:red;
cursor:pointer;
margin-left:10px;
}

.resumen{
margin:40px auto;
padding:20px;
background:#1e1e1e;
border-radius:10px;
max-width:420px;
text-align:center;
}

.correcto{color:#00ff99}
.error{color:red}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<h2>Agregar Responsable</h2>

<div class="card">

<input id="nombreResp" placeholder="Nombre responsable">

<button onclick="agregarResponsable()">Agregar</button>

<div id="listaResp"></div>

</div>


<h2>Agregar Servicio</h2>

<div class="card">

<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>Aseo</option>
<option>Seguro</option>
<option>Netflix - YouTube</option>
</select>

<input id="valorServicio" type="number" placeholder="Valor servicio">

<input id="fechaPago" type="date">

<div id="distribucionInputs"></div>

<button onclick="agregarServicio()">Agregar Servicio</button>

</div>


<h2>Servicios acumulados</h2>

<div id="listaServicios"></div>


<h2>Distribución de servicios</h2>

<div id="tarjetas"></div>


<div class="resumen">

<h3>Resumen General</h3>

<p>Total Servicios Ingresados: <span id="totalFactura">$0</span></p>

<p>Total Distribuido: <span id="totalDistribuido">$0</span></p>

<p>Total Ajustes: <span id="totalAjustes">$0</span></p>

<p id="validacion"></p>

<br>

<button onclick="exportarExcel()">📊 Descargar Excel</button>

</div>


<script>

let responsables=[]
let servicios=[]
let ajustes={}


function guardar(){
localStorage.setItem("dataServicios",JSON.stringify({responsables,servicios,ajustes}))
}

function cargar(){

let data=localStorage.getItem("dataServicios")

if(data){
let obj=JSON.parse(data)
responsables=obj.responsables||[]
servicios=obj.servicios||[]
ajustes=obj.ajustes||{}
}

}

cargar()


window.onbeforeunload=function(){
if(servicios.length>0||responsables.length>0){
return "¿Seguro que desea actualizar la página?"
}
}


function formato(n){
return "$"+Math.round(n).toLocaleString("es-CO")
}

function redondearArriba100(n){
return Math.ceil(n/100)*100
}


function agregarResponsable(){

let nombre=document.getElementById("nombreResp").value.trim()

if(!nombre)return

responsables.push(nombre)

document.getElementById("nombreResp").value=""

renderResponsables()
renderTarjetas()

guardar()

}


function eliminarResponsable(i){

if(!confirm("¿Seguro eliminar responsable?"))return

let nombre=responsables[i]

responsables.splice(i,1)

delete ajustes[nombre]

servicios.forEach(s=>{
s.distribucion=s.distribucion.filter(d=>d.responsable!==nombre)
})

renderResponsables()
renderTarjetas()

guardar()

}


function renderResponsables(){

let html="<ul>"

responsables.forEach((r,i)=>{
html+=`<li>${r} <span class="x" onclick="eliminarResponsable(${i})">x</span></li>`
})

html+="</ul>"

document.getElementById("listaResp").innerHTML=html

let inputs=""

responsables.forEach((r,i)=>{
inputs+=`${r}: <input type="number" id="dist_${i}" placeholder="Personas"><br>`
})

document.getElementById("distribucionInputs").innerHTML=inputs

}


function agregarServicio(){

let nombre=document.getElementById("servicio").value
let valor=parseFloat(document.getElementById("valorServicio").value)||0
let fecha=document.getElementById("fechaPago").value

if(servicios.some(s=>s.nombre===nombre)){
alert("Servicio ya existe")
return
}

let totalPersonas=0
let distribucion=[]

responsables.forEach((r,i)=>{

let p=parseFloat(document.getElementById("dist_"+i).value)||0

if(p>0){
distribucion.push({responsable:r,personas:p})
totalPersonas+=p
}

})

if(!Number.isInteger(totalPersonas)){
alert("Total personas debe ser entero")
return
}

servicios.push({nombre,valor,fecha,distribucion,totalPersonas})

renderServicios()
renderTarjetas()

guardar()

}


function renderServicios(){

let html=""

servicios.forEach((s,i)=>{

html+=`
<div class="card">

<b>${s.nombre}</b>

<p>Valor servicio: ${formato(s.valor)}</p>

<p>Personas totales: ${s.totalPersonas}</p>

<button onclick="editarServicio(${i})">Editar</button>

<span class="x" onclick="eliminarServicio(${i})">x</span>

</div>
`

})

document.getElementById("listaServicios").innerHTML=html

}


function editarServicio(i){

let s=servicios[i]

let html=`
<div class="card">

<b>${s.nombre}</b>

Valor servicio
<input type="number" id="editValor${i}" value="${s.valor}">

Personas totales
<input type="number" id="editPersonas${i}" value="${s.totalPersonas}">

<br>

<button onclick="guardarEdicion(${i})">Guardar</button>

<button onclick="renderServicios()">Cancelar</button>

</div>
`

document.getElementById("listaServicios").innerHTML=html

}


function guardarEdicion(i){

let valor=parseFloat(document.getElementById("editValor"+i).value)||0
let personas=parseFloat(document.getElementById("editPersonas"+i).value)||0

if(!Number.isInteger(personas)){
alert("Personas debe ser entero")
return
}

servicios[i].valor=valor
servicios[i].totalPersonas=personas

renderServicios()
renderTarjetas()

guardar()

}


function eliminarServicio(i){

if(!confirm("¿Seguro eliminar servicio?"))return

servicios.splice(i,1)

renderServicios()
renderTarjetas()

guardar()

}


function eliminarDistribucion(servIndex,nombre){

if(!confirm("¿Seguro eliminar servicio de tarjeta?"))return

let s=servicios[servIndex]

s.distribucion=s.distribucion.filter(d=>d.responsable!==nombre)

renderTarjetas()

guardar()

}


function aplicarAjuste(nombre){

let concepto=document.getElementById("concepto_"+nombre).value
let valor=parseFloat(document.getElementById("valor_"+nombre).value)||0

if(!valor)return

if(!ajustes[nombre])ajustes[nombre]=[]

ajustes[nombre].push({concepto,valor})

renderTarjetas()

guardar()

}


function eliminarAjuste(nombre,i){

if(!confirm("¿Seguro eliminar ajt?"))return

ajustes[nombre].splice(i,1)

renderTarjetas()

guardar()

}


function renderTarjetas(){

let html=""
let totalFactura=0
let totalDistribuido=0
let totalAjustes=0

responsables.forEach(r=>{

let filas=""
let totalPersona=0

servicios.forEach((s,index)=>{

let dist=s.distribucion.find(d=>d.responsable===r)

if(dist){

let unit=s.valor/s.totalPersonas
let valorDist=unit*dist.personas

totalPersona+=valorDist
totalDistribuido+=valorDist
totalFactura+=s.valor

filas+=`
<tr>
<td>${s.nombre}</td>
<td class="valorFactura">${formato(s.valor)}</td>
<td>${dist.personas}</td>
<td class="valorDistribuido">${formato(valorDist)}</td>
<td><span class="x" onclick="eliminarDistribucion(${index},'${r}')">x</span></td>
</tr>
`

}

})

let lista=ajustes[r]||[]

lista.forEach((a,i)=>{

totalPersona+=a.valor
totalAjustes+=a.valor

filas+=`
<tr>
<td colspan="3">Ajt: ${a.concepto}</td>
<td>${formato(a.valor)}</td>
<td><span class="x" onclick="eliminarAjuste('${r}',${i})">x</span></td>
</tr>
`

})


html+=`
<div class="card">

<h2>${r}</h2>

<table>

<tr>
<th>Servicio</th>
<th>Valor</th>
<th>Personas</th>
<th>Valor Distr.</th>
<th></th>
</tr>

${filas}

</table>

<br>

<input type="checkbox" onchange="document.getElementById('aj_${r}').style.display=this.checked?'block':'none'"> Ajt

<div id="aj_${r}" style="display:none">

<input id="concepto_${r}" placeholder="Concepto ajt">
<input type="number" id="valor_${r}" placeholder="Valor ajt">

<button onclick="aplicarAjuste('${r}')">Agregar</button>

</div>

<p class="total">Total a pagar: ${formato(redondearArriba100(totalPersona))}</p>

</div>
`

})

document.getElementById("tarjetas").innerHTML=html

document.getElementById("totalFactura").innerText=formato(totalFactura)
document.getElementById("totalDistribuido").innerText=formato(totalDistribuido)
document.getElementById("totalAjustes").innerText=formato(totalAjustes)

let valid=document.getElementById("validacion")

if(Math.round(totalFactura)===Math.round(totalDistribuido)){
valid.innerHTML="✔ Distribución correcta"
valid.className="correcto"
}else{
valid.innerHTML="❌ Diferencia detectada"
valid.className="error"
}

}


function exportarExcel(){

let filas=[]

servicios.forEach(servicio=>{

servicio.distribucion.forEach(dist=>{

let unit=servicio.valor/servicio.totalPersonas
let valorPagar=unit*dist.personas

filas.push({
Servicio:servicio.nombre,
ValorServicio:servicio.valor,
PersonasTotales:servicio.totalPersonas,
Responsable:dist.responsable,
PersonasResponsable:dist.personas,
ValorPagar:valorPagar
})

})

})

let wb=XLSX.utils.book_new()
let ws=XLSX.utils.json_to_sheet(filas)

XLSX.utils.book_append_sheet(wb,ws,"Servicios")

XLSX.writeFile(wb,"DistribucionServicios.xlsx")

}

renderResponsables()
renderServicios()
renderTarjetas()

</script>

</body>
</html>
