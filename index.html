<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución de Recibos</title>

<style>
body{
font-family:'Segoe UI',sans-serif;
background:#f3f4f6;
margin:0;
padding:20px;
}

.container{max-width:1200px;margin:auto}

.card{
background:#111827;
color:white;
padding:20px;
border-radius:16px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
margin-bottom:25px;
}

.factura{color:#9ca3af;}
.distribuido{color:#22c55e;font-weight:bold;}
.total-final{font-size:20px;color:#facc15;margin-top:15px;}
.fecha{font-size:13px;color:#f87171;margin-bottom:10px;}

input{
padding:6px;
border-radius:6px;
border:1px solid #ccc;
width:100%;
}

button{
background:#2563eb;
color:white;
border:none;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
margin-top:6px;
}

.delete-btn{
color:#ef4444;
cursor:pointer;
font-size:14px;
}

.summary{
background:white;
padding:20px;
border-radius:15px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:8px;
border-bottom:1px solid #374151;
text-align:center;
font-size:14px;
}

.small-check{
transform:scale(.8);
margin-right:6px;
}

@media(max-width:768px){
table{font-size:12px}
}
</style>
</head>

<body>
<div class="container">

<h2>Agregar Servicio</h2>
<div style="background:white;padding:20px;border-radius:15px">

<select id="serviceName">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="serviceValue" placeholder="Valor del servicio">
<input type="date" id="serviceDate">
<button onclick="addService()">Agregar</button>

</div>

<h2>Representantes</h2>
<div id="representatives"></div>

<h2>Resumen General</h2>
<div class="summary" id="summary"></div>

</div>

<script>

let services=[]

let reps=[
{nombre:"Jorge Garzón", personasPorServicio:{}, ajuste:{activo:false,nombre:"",valor:0}, eliminado:[]},
{nombre:"Jorge Balero", personasPorServicio:{}, ajuste:{activo:false,nombre:"",valor:0}, eliminado:[]},
{nombre:"Arturo Castro", personasPorServicio:{}, ajuste:{activo:false,nombre:"",valor:0}, eliminado:[]},
{nombre:"Ismael Garzón", personasPorServicio:{}, ajuste:{activo:false,nombre:"",valor:0}, eliminado:[]}
]

function format(n){
return Math.round(n).toLocaleString("es-CO")
}

function round100(n){
return Math.ceil(n/100)*100
}

function formatDate(fecha){
if(!fecha) return "-"
let d=new Date(fecha)
return d.toLocaleDateString("es-CO")
}

function addService(){
let name=document.getElementById("serviceName").value
let value=parseFloat(document.getElementById("serviceValue").value)
let date=document.getElementById("serviceDate").value
if(!value || !date) return
services.push({name,value,date})
render()
}

function render(){

let totalIngresado=services.reduce((a,b)=>a+b.value,0)
let totalDistribuido=0
let totalAjustes=0

let container=document.getElementById("representatives")
container.innerHTML=""

reps.forEach((rep,ri)=>{

let card=document.createElement("div")
card.className="card"

let totalRep=0
let fechaLimite="-"

let tabla=`
<table>
<tr>
<th>Servicio</th>
<th>Valor Factura</th>
<th>Personas</th>
<th>Valor Distr</th>
<th></th>
</tr>`

services.forEach((s,si)=>{

if(rep.eliminado.includes(si)) return

let personasRep=Math.round(rep.personasPorServicio[si] || 0)

if(personasRep<=0) return

let totalPersonasServicio=0

reps.forEach(r=>{
let p=Math.round(r.personasPorServicio[si] || 0)
totalPersonasServicio+=p
})

if(totalPersonasServicio===0) return

let unitario=s.value/totalPersonasServicio
let valor=unitario*personasRep

totalRep+=valor
totalDistribuido+=valor
fechaLimite=s.date

tabla+=`
<tr>
<td>${s.name}</td>
<td class="factura">$${format(s.value)}</td>
<td>
<input type="number" min="0" value="${rep.personasPorServicio[si]||0}"
oninput="setPersonas(${ri},${si},this.value)">
</td>
<td class="distribuido">$${format(valor)}</td>
<td><span class="delete-btn" onclick="removeService(${ri},${si})">✖</span></td>
</tr>`
})

tabla+="</table>"

if(rep.ajuste.activo){
totalRep+=rep.ajuste.valor
totalAjustes+=rep.ajuste.valor
}

let totalFinal=round100(totalRep)

let ajusteHTML=""

if(rep.ajuste.activo){
ajusteHTML=`
<div style="margin-top:10px;background:#1f2937;padding:10px;border-radius:8px">
<strong>${rep.ajuste.nombre}</strong> 
($${format(rep.ajuste.valor)})
<span class="delete-btn" onclick="eliminarAjuste(${ri})">✖</span>
</div>`
}else{
ajusteHTML=`
<div style="margin-top:10px">
<label style="font-size:12px;color:#9ca3af">
<input type="checkbox" class="small-check"
onchange="mostrarAjuste(${ri},this.checked)">
 Aplicar ajuste
</label>
<div id="formAjuste-${ri}" style="display:none;margin-top:8px">
<input id="nombreAjuste-${ri}" placeholder="Nombre del ajuste">
<input id="valorAjuste-${ri}" type="number" placeholder="Valor ajuste">
<button onclick="aplicarAjuste(${ri})">Aplicar</button>
</div>
</div>`
}

card.innerHTML=`
<h3>${rep.nombre}</h3>
<div class="fecha">Pagar antes de: ${formatDate(fechaLimite)}</div>
${tabla}
${ajusteHTML}
<div class="total-final">
Total a pagar: $${format(totalFinal)}
</div>
`

container.appendChild(card)
})

let diferencia=totalIngresado-totalDistribuido

document.getElementById("summary").innerHTML=`
Total servicios ingresados: $${format(totalIngresado)}<br>
Total servicios distribuidos: $${format(totalDistribuido)}<br>
Total ajustes: $${format(totalAjustes)}<br>
Diferencia: $${format(diferencia)}
`
}

function setPersonas(ri,si,val){
reps[ri].personasPorServicio[si]=parseFloat(val)||0
render()
}

function mostrarAjuste(ri,estado){
document.getElementById(`formAjuste-${ri}`).style.display=estado?"block":"none"
}

function aplicarAjuste(ri){
let nombre=document.getElementById(`nombreAjuste-${ri}`).value
let valor=parseFloat(document.getElementById(`valorAjuste-${ri}`).value)||0
reps[ri].ajuste={activo:true,nombre:nombre,valor:valor}
render()
}

function eliminarAjuste(ri){
reps[ri].ajuste={activo:false,nombre:"",valor:0}
render()
}

function removeService(ri,si){
reps[ri].personasPorServicio[si]=0
render()
}

render()

</script>
</body>
</html>
