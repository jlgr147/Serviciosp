<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Profesional</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    padding:20px;
}
.container{
    background:white;
    padding:25px;
    border-radius:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
    margin:5px;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
}
button:hover{opacity:0.9;}
.card{
    background:#1f1f1f;
    color:white;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}
table{
    width:100%;
    margin-top:10px;
    border-collapse:collapse;
}
th,td{
    padding:8px;
    text-align:center;
}
th{
    background:#2a5298;
}
.valor{
    color:#ff4fa3;
    font-weight:bold;
}
.total{
    margin-top:10px;
    font-weight:bold;
}
.fecha{
    color:#00ffb3;
    font-size:14px;
}
.correcto{color:green;font-weight:bold;}
.error{color:red;font-weight:bold;}
</style>
</head>
<body>

<div class="container">

<h2>Agregar Servicio</h2>

<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="valor" placeholder="Valor total servicio">
<input type="date" id="fecha">

<select id="representante">
<option>Jorge Garzón</option>
<option>Jorge Balero</option>
<option>Arturo Castro</option>
<option>Ismael Garzón</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad personas">

<label>
<input type="checkbox" id="aplica" checked> Aplica
</label>

<button onclick="agregarServicio()">Agregar</button>

<label>
<input type="checkbox" id="redondear"> Redondear al 100 más cercano
</label>

<div id="tarjetas"></div>

<h2>Total General Servicios: $ <span id="totalGeneral">0</span></h2>
<div id="mensaje"></div>

</div>

<script>

let datos = [];

function agregarServicio(){

    let nombre = servicio.value;
    let valor = parseFloat(valorInput.value);
    let fecha = fechaInput.value;
    let rep = representante.value;
    let cantidad = parseFloat(cantidadInput.value);
    let aplica = aplicaCheck.checked;

    if(!valor || !fecha || !cantidad){
        alert("Complete los datos");
        return;
    }

    if(!aplica) return;

    datos.push({nombre,valor,fecha,rep,cantidad});
    render();
}

const servicio = document.getElementById("servicio");
const valorInput = document.getElementById("valor");
const fechaInput = document.getElementById("fecha");
const representante = document.getElementById("representante");
const cantidadInput = document.getElementById("cantidad");
const aplicaCheck = document.getElementById("aplica");

function render(){

    let contenedor = document.getElementById("tarjetas");
    contenedor.innerHTML="";

    let reps = [...new Set(datos.map(d=>d.rep))];

    let totalGeneralReal = 0;
    let totalDistribuido = 0;

    reps.forEach(rep=>{

        let serviciosRep = datos.filter(d=>d.rep===rep);

        let card = document.createElement("div");
        card.className="card";

        let html=`<h3>${rep}</h3>
        <table>
        <tr>
        <th>Servicio</th>
        <th>Valor General</th>
        <th>Personas</th>
        <th>Valor Distr</th>
        </tr>`;

        let totalPersona=0;
        let fechaMasCercana=null;

        serviciosRep.forEach(s=>{

            let valorPersona = s.valor / s.cantidad;

            if(redondear.checked){
                valorPersona = Math.round(valorPersona/100)*100;
            }

            html+=`
            <tr>
            <td>${s.nombre}</td>
            <td>$ ${s.valor.toLocaleString()}</td>
            <td>${s.cantidad}</td>
            <td class="valor">$ ${valorPersona.toLocaleString()}</td>
            </tr>`;

            totalPersona+=valorPersona;
            totalGeneralReal+=s.valor;
            totalDistribuido+=valorPersona;

            if(!fechaMasCercana || s.fecha < fechaMasCercana){
                fechaMasCercana=s.fecha;
            }
        });

        html+=`</table>`;

        html+=`
        <div class="total">
        Ajuste: <input type="number" value="0" onchange="render()">
        </div>`;

        html+=`
        <div class="total">
        Total a pagar: $ ${totalPersona.toLocaleString()}
        </div>`;

        html+=`
        <div class="fecha">
        Pagar antes de: ${fechaMasCercana || ""}
        </div>`;

        card.innerHTML=html;
        contenedor.appendChild(card);
    });

    document.getElementById("totalGeneral").innerText=totalGeneralReal.toLocaleString();

    if(totalGeneralReal === totalDistribuido){
        mensaje.innerHTML="<div class='correcto'>Distribución correcta ✅</div>";
    }else{
        mensaje.innerHTML="<div class='error'>Hay diferencia ⚠</div>";
    }
}

</script>

</body>
</html>
