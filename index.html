<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Servicios Públicos</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h2{
    margin-top:30px;
}

input,button,select{
    padding:6px;
    margin:5px 0;
}

button{
    cursor:pointer;
}

.section{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.tarjetas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.card{
    background:#1e1e1e;
    color:white;
    padding:15px;
    border-radius:10px;
    position:relative;
}

.distribuido{
    color:#4fc3f7;
}

.factura{
    color:#ffb74d;
}

.total-pagar{
    font-size:18px;
    font-weight:bold;
    color:#4caf50;
}

.x-btn{
    color:red;
    cursor:pointer;
    font-weight:bold;
    margin-left:5px;
}

.check-ajuste{
    transform:scale(0.8);
}

.resumen{
    background:#e8f5e9;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}

.diferencia{
    color:red;
}
</style>
</head>
<body>

<h2>Agregar Servicio</h2>
<div class="section">
    Servicio:
    <input type="text" id="nombreServicio">
    Valor:
    <input type="number" id="valorServicio">
    Fecha límite:
    <input type="date" id="fechaServicio">
    <button onclick="agregarServicio()">Agregar Servicio</button>
</div>

<h2>Servicios Ingresados</h2>
<div class="section" id="listaServicios"></div>

<h2>Agregar Responsable</h2>
<div class="section">
    Nombre:
    <input type="text" id="nombreResponsable">
    <button onclick="agregarResponsable()">Agregar Responsable</button>
</div>

<h2>Distribución por Responsable</h2>
<div class="tarjetas" id="tarjetas"></div>

<h2>Resumen General</h2>
<div class="resumen" id="resumen"></div>

<script>
let servicios = [];
let responsables = [];

function formato(valor){
    return Number(valor).toLocaleString('es-CO');
}

function agregarServicio(){
    let nombre = document.getElementById("nombreServicio").value.trim().toLowerCase();
    let valor = parseFloat(document.getElementById("valorServicio").value);
    let fecha = document.getElementById("fechaServicio").value;

    if(!nombre || !valor || !fecha) return alert("Complete todos los campos");

    if(servicios.some(s=>s.nombre===nombre)){
        return alert("Este servicio ya fue ingresado");
    }

    servicios.push({nombre,valor,fecha});
    renderServicios();
    renderTarjetas();
}

function eliminarServicio(nombre){
    servicios = servicios.filter(s=>s.nombre!==nombre);
    responsables.forEach(r=>{
        delete r.personas[nombre];
    });
    renderServicios();
    renderTarjetas();
}

function renderServicios(){
    let cont = document.getElementById("listaServicios");
    cont.innerHTML="";
    servicios.forEach(s=>{
        cont.innerHTML+=`
        <div>
            ${s.nombre.toUpperCase()} - $${formato(s.valor)}
            <span class="x-btn" onclick="eliminarServicio('${s.nombre}')">❌</span>
        </div>`;
    });
}

function agregarResponsable(){
    let nombre = document.getElementById("nombreResponsable").value.trim();
    if(!nombre) return;
    responsables.push({nombre,personas:{},ajustes:[]});
    renderTarjetas();
}

function renderTarjetas(){
    let cont = document.getElementById("tarjetas");
    cont.innerHTML="";
    responsables.forEach((r,index)=>{
        let html=`<div class="card">
        <h3>${r.nombre}</h3>`;

        let total=0;

        servicios.forEach(s=>{
            let personas = r.personas[s.nombre]||0;
            html+=`
            ${s.nombre.toUpperCase()} 
            Personas:
            <input type="number" min="0" step="1" value="${personas}"
            onchange="actualizarPersonas(${index},'${s.nombre}',this.value)">
            `;
            if(personas>0){
                let totalPersonas = totalPersonasServicio(s.nombre);
                let unitario = s.valor/totalPersonas;
                let distribuido = unitario*personas;
                total+=distribuido;
                html+=`
                <div class="factura">Factura: $${formato(s.valor)}</div>
                <div class="distribuido">
                    Distribuido: $${formato(Math.round(distribuido/100)*100)}
                    <span class="x-btn" onclick="quitarDistribucion(${index},'${s.nombre}')">❌</span>
                </div>
                <div>Fecha límite: ${formatoFecha(s.fecha)}</div>
                `;
            }
        });

        let totalAjustes = r.ajustes.reduce((a,b)=>a+b.valor,0);
        total+=totalAjustes;

        html+=`<hr>`;

        r.ajustes.forEach((a,i)=>{
            html+=`
            Ajuste: ${a.nombre} $${formato(a.valor)}
            <span class="x-btn" onclick="eliminarAjuste(${index},${i})">❌</span>
            <br>`;
        });

        html+=`
        <div>
            <input type="checkbox" class="check-ajuste"
            onchange="toggleAjuste(${index},this.checked)">
            Ajuste
        </div>
        <div id="ajuste-${index}" style="display:none;">
            Nombre:
            <input type="text" id="nombreAjuste-${index}">
            Valor:
            <input type="number" id="valorAjuste-${index}">
            <button onclick="agregarAjuste(${index})">Agregar</button>
        </div>
        <hr>
        <div class="total-pagar">
            Total a pagar: $${formato(Math.round(total/100)*100)}
        </div>
        </div>`;

        cont.innerHTML+=html;
    });

    renderResumen();
}

function actualizarPersonas(index,servicio,valor){
    let num = Math.round(Number(valor));
    if(num<0) num=0;
    responsables[index].personas[servicio]=num;
    renderTarjetas();
}

function quitarDistribucion(index,servicio){
    responsables[index].personas[servicio]=0;
    renderTarjetas();
}

function totalPersonasServicio(servicio){
    let suma=0;
    responsables.forEach(r=>{
        suma+=r.personas[servicio]||0;
    });
    if(!Number.isInteger(suma)){
        alert("La suma de personas debe ser número entero");
    }
    return suma||1;
}

function toggleAjuste(index,estado){
    document.getElementById("ajuste-"+index).style.display=
        estado?"block":"none";
}

function agregarAjuste(index){
    let nombre=document.getElementById("nombreAjuste-"+index).value;
    let valor=parseFloat(document.getElementById("valorAjuste-"+index).value);
    if(!nombre||!valor) return;
    responsables[index].ajustes.push({nombre,valor});
    document.getElementById("ajuste-"+index).style.display="none";
    renderTarjetas();
}

function eliminarAjuste(index,i){
    responsables[index].ajustes.splice(i,1);
    renderTarjetas();
}

function formatoFecha(fecha){
    let f=new Date(fecha);
    return f.getDate()+"/"+(f.getMonth()+1)+"/"+f.getFullYear();
}

function renderResumen(){
    let totalServicios=servicios.reduce((a,b)=>a+b.valor,0);
    let totalDistribuido=0;
    let totalAjustes=0;

    responsables.forEach(r=>{
        servicios.forEach(s=>{
            let totalPersonas=totalPersonasServicio(s.nombre);
            let unitario=s.valor/totalPersonas;
            totalDistribuido+=unitario*(r.personas[s.nombre]||0);
        });
        totalAjustes+=r.ajustes.reduce((a,b)=>a+b.valor,0);
    });

    let diferencia = totalServicios - totalDistribuido;

    document.getElementById("resumen").innerHTML=`
    Total servicios ingresados: $${formato(totalServicios)} <br>
    Total servicios distribuidos: $${formato(Math.round(totalDistribuido/100)*100)} <br>
    Total ajustes: $${formato(totalAjustes)} <br>
    Diferencia detectada: 
    <span class="${diferencia!==0?'diferencia':''}">
    $${formato(diferencia)}
    </span>
    `;
}
</script>

</body>
</html>
