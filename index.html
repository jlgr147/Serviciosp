<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Profesional</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    padding:15px;
    margin:0;
}
.container{
    background:white;
    padding:20px;
    border-radius:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
    margin:5px 0;
    width:100%;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
    margin-top:5px;
}
button:hover{opacity:0.9;}

.form-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}

.card{
    background:#1f1f1f;
    color:white;
    padding:15px;
    border-radius:20px;
    margin-top:20px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    padding:6px;
    text-align:center;
    font-size:14px;
}

th{
    background:#2a5298;
}

.valor{
    color:#ff4fa3;
    font-weight:bold;
}

.total{
    margin-top:10px;
    font-weight:bold;
}

.fecha{
    color:#00ffb3;
    font-size:13px;
}

.correcto{color:green;font-weight:bold;}
.error{color:red;font-weight:bold;}

@media(max-width:600px){
    th,td{font-size:12px;}
}
</style>
</head>
<body>

<div class="container">

<h2>Agregar Servicio</h2>

<div class="form-grid">
<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="valor" placeholder="Valor total servicio">
<input type="date" id="fecha">

<select id="representante">
<option>Jorge Garzón</option>
<option>Jorge Balero</option>
<option>Arturo Castro</option>
<option>Ismael Garzón</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad personas que asume">

<button onclick="agregarServicio()">Agregar</button>
</div>

<label>
<input type="checkbox" id="redondear"> Redondear al 100 más cercano
</label>

<div id="tarjetas"></div>

<h3>Total General Servicios: $ <span id="totalGeneral">0</span></h3>
<div id="mensaje"></div>

</div>

<script>

let datos = [];

function formato(n){
    return Math.round(n).toLocaleString("es-CO");
}

function agregarServicio(){

    let nombre = servicio.value;
    let valor = parseFloat(valorInput.value);
    let fecha = fechaInput.value;
    let rep = representante.value;
    let cantidad = parseFloat(cantidadInput.value);

    if(!valor || !fecha || !cantidad){
        alert("Complete los datos");
        return;
    }

    datos.push({nombre,valor,fecha,rep,cantidad});
    render();
}

const servicio = document.getElementById("servicio");
const valorInput = document.getElementById("valor");
const fechaInput = document.getElementById("fecha");
const representante = document.getElementById("representante");
const cantidadInput = document.getElementById("cantidad");
const redondear = document.getElementById("redondear");

function render(){

    let contenedor = document.getElementById("tarjetas");
    contenedor.innerHTML="";

    let serviciosUnicos = [...new Set(datos.map(d=>d.nombre))];

    let totalReal = 0;
    let totalDistribuido = 0;

    let reps = [...new Set(datos.map(d=>d.rep))];

    reps.forEach(rep=>{

        let serviciosRep = datos.filter(d=>d.rep===rep);

        let card = document.createElement("div");
        card.className="card";

        let html=`<h3>${rep}</h3>
        <table>
        <tr>
        <th>Servicio</th>
        <th>Valor General</th>
        <th>Personas</th>
        <th>Valor Distr</th>
        </tr>`;

        let totalPersona=0;
        let fechaMasCercana=null;

        serviciosRep.forEach(s=>{

            // Total personas que aplican a este servicio
            let totalPersonasServicio =
                datos.filter(d=>d.nombre===s.nombre)
                     .reduce((a,b)=>a+b.cantidad,0);

            let valorUnitario = s.valor / totalPersonasServicio;

            if(redondear.checked){
                valorUnitario = Math.round(valorUnitario/100)*100;
            }

            let valorDistribuido = valorUnitario * s.cantidad;

            html+=`
            <tr>
            <td>${s.nombre}</td>
            <td>$ ${formato(s.valor)}</td>
            <td>${s.cantidad}</td>
            <td class="valor">$ ${formato(valorDistribuido)}</td>
            </tr>`;

            totalPersona+=valorDistribuido;
            totalReal+=s.valor;
            totalDistribuido+=valorDistribuido;

            if(!fechaMasCercana || s.fecha < fechaMasCercana){
                fechaMasCercana=s.fecha;
            }
        });

        html+=`</table>`;

        html+=`
        <div class="total">
        Nombre ajuste:
        <input type="text" placeholder="Ej: Saldo anterior">
        Valor ajuste:
        <input type="number" value="0" onchange="render()">
        </div>`;

        html+=`
        <div class="total">
        Total a pagar: $ ${formato(totalPersona)}
        </div>`;

        html+=`
        <div class="fecha">
        Pagar antes de: ${fechaMasCercana || ""}
        </div>`;

        card.innerHTML=html;
        contenedor.appendChild(card);
    });

    document.getElementById("totalGeneral").innerText=formato(totalReal);

    if(Math.round(totalReal) === Math.round(totalDistribuido)){
        mensaje.innerHTML="<div class='correcto'>Distribución correcta ✅</div>";
    }else{
        mensaje.innerHTML="<div class='error'>Hay diferencia ⚠</div>";
    }
}

</script>

</body>
</html>
