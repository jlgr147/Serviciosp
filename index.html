<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distribución Inteligente</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { margin: 0; background: linear-gradient(135deg,#1e3c72,#2a5298); display:flex; justify-content:center; padding:40px 20px; }
    .app { background:white; width:100%; max-width:900px; border-radius:20px; padding:30px; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
    h1 { margin-top:0; font-size:24px; }
    .row { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
    input, button { padding:10px 14px; border-radius:10px; border:1px solid #ddd; font-size:14px; }
    input[type="number"] { flex:1; }
    button { background:#2a5298; color:white; border:none; cursor:pointer; font-weight:600; }
    button:hover { opacity:0.9; }
    .toggle { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:15px; margin-top:20px; }
    .card { background:#f4f6fb; padding:15px; border-radius:16px; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
    .card h3 { margin:0 0 10px 0; font-size:16px; }
    .total { margin-top:20px; font-weight:700; }
    .alert { margin-top:10px; font-size:14px; }
    .ok { color:green; }
    .error { color:red; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Distribución Dinámica</h1><div class="row">
  <input type="number" id="total" placeholder="Total a distribuir" />
  <button onclick="distribuir()">Distribuir</button>
</div>

<div class="row">
  <input type="text" id="nombre" placeholder="Nombre persona (ej: Jorge)" />
  <button onclick="agregarPersona()">Agregar</button>
</div>

<div class="toggle">
  <input type="checkbox" id="redondear" checked />
  <label for="redondear">Redondear al 100 más cercano</label>
</div>

<div class="cards" id="personas"></div>

<div class="total" id="resultado"></div>
<div class="alert" id="alerta"></div>

  </div>  <script>
    let lista = [];

    function agregarPersona() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) return;
      lista.push({ nombre, valor: 0 });
      document.getElementById('nombre').value = '';
      render();
    }

    function distribuir() {
      const total = parseFloat(document.getElementById('total').value);
      if (!total || lista.length === 0) return;

      const redondear = document.getElementById('redondear').checked;
      let base = total / lista.length;
      let suma = 0;

      lista = lista.map((p, i) => {
        let valor = base;
        if (redondear) {
          valor = Math.round(valor / 100) * 100;
        }
        if (i === lista.length - 1) {
          valor = redondear ? total - suma : base;
        }
        suma += valor;
        return { ...p, valor };
      });

      render();

      const alerta = document.getElementById('alerta');
      if (suma === total) {
        alerta.textContent = 'Distribución correcta ✅';
        alerta.className = 'alert ok';
      } else {
        alerta.textContent = 'Hay diferencia en la distribución ⚠️';
        alerta.className = 'alert error';
      }
    }

    function render() {
      const cont = document.getElementById('personas');
      cont.innerHTML = '';
      lista.forEach(p => {
        cont.innerHTML += `
          <div class="card">
            <h3>${p.nombre}</h3>
            <div>$ ${p.valor.toLocaleString()}</div>
          </div>
        `;
      });
    }
  </script></body>
</html>
