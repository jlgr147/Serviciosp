<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Distribución de Servicios</title>

<style>

body{
background:#111;
color:#fff;
font-family:Arial;
margin:0;
padding:20px;
}

h1{text-align:center}

.encabezado{
text-align:center;
margin-bottom:30px;
}

.mes{
color:#00d2d3;
font-size:22px;
}

.fechaPago{
color:red;
font-size:26px;
font-weight:bold;
}

.card{
background:#1e1e1e;
padding:30px;
margin:25px auto;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
width:95%;
max-width:1100px;
}

input,select{
padding:10px;
border-radius:6px;
border:none;
margin:5px 0;
width:100%;
font-size:16px;
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
cursor:pointer;
background:#00b894;
color:white;
margin-top:5px;
}

table{
width:100%;
margin-top:15px;
border-collapse:collapse;
font-size:18px;
}

th,td{
padding:10px;
text-align:center;
}

th{
background:#333;
}

.valorFactura{color:#aaa}
.valorDistribuido{color:#00cec9;font-weight:bold}

.total{
font-size:28px;
font-weight:bold;
color:#00ff99;
margin-top:15px;
}

.x{
color:red;
cursor:pointer;
font-size:20px;
}

.notificacion{
position:fixed;
top:20px;
right:20px;
background:#00b894;
padding:15px 25px;
border-radius:10px;
display:none;
}

.correcto{color:#00ff99}
.error{color:red}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>
<body>

<div id="noti" class="notificacion"></div>

<div class="encabezado">

<h1>Distribución de Servicios</h1>

<p class="mes">Facturas mes: febrero 2026</p>

<div class="fechaPago">
Pagar antes de:
<input type="date" id="fechaPago" onchange="guardarDatos()">
</div>

</div>


<div class="card">

<h2>Agregar Responsable</h2>

<input id="nombreResp" placeholder="Nombre responsable">

<button onclick="agregarResponsable()">Agregar</button>

<div id="listaResp"></div>

</div>


<div class="card">

<h2>Agregar Servicio</h2>

<select id="servicio">
<option>Agua</option>
<option>Gas</option>
<option>Luz</option>
<option>Aseo</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Seguro</option>
<option>Netflix - YouTube</option>
</select>

<input id="valorServicio" type="number" placeholder="Valor servicio">

<div id="distribucionInputs"></div>

<button onclick="agregarServicio()">Agregar servicio</button>

</div>


<h2 style="text-align:center">Servicios acumulados</h2>

<div id="listaServicios"></div>

<h2 style="text-align:center">Distribución de servicios</h2>

<div id="tarjetas"></div>


<div class="card">

<h3>Resumen General</h3>

<p>Total Servicios Ingresados: <span id="totalFactura">$0</span></p>
<p>Total Distribuido: <span id="totalDistribuido">$0</span></p>
<p>Total Ajustes: <span id="totalAjustes">$0</span></p>

<p id="validacion"></p>

<button onclick="exportarExcel()">📊 Exportar Excel</button>

</div>


<script>

let responsables=[]
let servicios=[]
let ajustes={}

function noti(t){

let n=document.getElementById("noti")
n.innerText=t
n.style.display="block"

setTimeout(()=>n.style.display="none",2000)

}

function formato(n){
return "$"+Math.round(n).toLocaleString("es-CO")
}

function redondear100(n){
return Math.ceil(n/100)*100
}

function guardarDatos(){

let data={responsables,servicios,ajustes,fecha:document.getElementById("fechaPago").value}

localStorage.setItem("serviciosApp",JSON.stringify(data))

}

function cargarDatos(){

let data=localStorage.getItem("serviciosApp")

if(data){

let obj=JSON.parse(data)

responsables=obj.responsables||[]
servicios=obj.servicios||[]
ajustes=obj.ajustes||{}

document.getElementById("fechaPago").value=obj.fecha||""

}

}

function agregarResponsable(){

let nombre=document.getElementById("nombreResp").value.trim()

if(!nombre)return

responsables.push(nombre)

document.getElementById("nombreResp").value=""

noti("Persona agregada")

guardarDatos()

render()

}

function agregarServicio(){

let nombre=document.getElementById("servicio").value
let valor=parseFloat(document.getElementById("valorServicio").value)||0

let total=0
let distribucion=[]

responsables.forEach((r,i)=>{

let p=parseInt(document.getElementById("dist_"+i)?.value)||0

if(p>0){
distribucion.push({responsable:r,personas:p})
total+=p
}

})

servicios.push({nombre,valor,totalPersonas:total,distribucion})

noti("Servicio agregado")

guardarDatos()

render()

}

function render(){

renderResponsables()
renderServicios()
renderTarjetas()

}

function renderResponsables(){

let html="<ul>"
let inputs=""

responsables.forEach((r,i)=>{

html+=`<li>${r}</li>`

inputs+=`${r}: <input type="number" id="dist_${i}" placeholder="Personas"><br>`

})

html+="</ul>"

document.getElementById("listaResp").innerHTML=html
document.getElementById("distribucionInputs").innerHTML=inputs

}

function editarServicio(i){

let s=servicios[i]

let nuevoValor=prompt("Nuevo valor servicio",s.valor)

let nuevasPersonas=prompt("Total personas",s.totalPersonas)

if(nuevoValor!==null)s.valor=parseFloat(nuevoValor)
if(nuevasPersonas!==null)s.totalPersonas=parseInt(nuevasPersonas)

guardarDatos()

render()

}

function eliminarServicio(i){

if(!confirm("¿Seguro eliminar servicio?"))return

servicios.splice(i,1)

guardarDatos()

render()

}

function renderServicios(){

let html=""

servicios.forEach((s,i)=>{

html+=`
<div class="card">

<b>${s.nombre}</b>

<p>Valor: ${formato(s.valor)}</p>

<p>Personas: ${s.totalPersonas}</p>

<button onclick="editarServicio(${i})">Editar</button>

<span class="x" onclick="eliminarServicio(${i})">x</span>

</div>
`

})

document.getElementById("listaServicios").innerHTML=html

}

function eliminarDistribucion(servIndex,responsable){

if(!confirm("¿Eliminar servicio de tarjeta?"))return

let s=servicios[servIndex]

s.distribucion=s.distribucion.filter(d=>d.responsable!==responsable)

guardarDatos()

render()

}

function renderTarjetas(){

let html=""

let totalFactura=0
let totalDistribuido=0
let totalAjustes=0

servicios.forEach(s=>totalFactura+=s.valor)

responsables.forEach(r=>{

let filas=""
let totalPersona=0

servicios.forEach((s,i)=>{

let d=s.distribucion.find(x=>x.responsable===r)

if(d){

let unit=s.valor/s.totalPersonas
let valor=unit*d.personas

totalPersona+=valor
totalDistribuido+=valor

filas+=`
<tr>

<td>${s.nombre}</td>

<td class="valorFactura">${formato(s.valor)}</td>

<td>${d.personas}</td>

<td class="valorDistribuido">${formato(valor)}</td>

<td><span class="x" onclick="eliminarDistribucion(${i},'${r}')">x</span></td>

</tr>
`

}

})

html+=`
<div class="card">

<h2>${r}</h2>

<table>

<tr>
<th>Servicio</th>
<th>Valor</th>
<th>Personas</th>
<th>Valor Distr.</th>
<th></th>
</tr>

${filas}

</table>

<p class="total">Total a pagar: ${formato(redondear100(totalPersona))}</p>

</div>
`

})

document.getElementById("tarjetas").innerHTML=html

document.getElementById("totalFactura").innerText=formato(totalFactura)
document.getElementById("totalDistribuido").innerText=formato(totalDistribuido)
document.getElementById("totalAjustes").innerText=formato(totalAjustes)

let valid=document.getElementById("validacion")

if(Math.round(totalFactura)==Math.round(totalDistribuido)){

valid.innerHTML="✔ Distribución correcta"
valid.className="correcto"

}else{

valid.innerHTML="❌ Diferencia detectada"
valid.className="error"

}

}

function exportarExcel(){

let filas=[]

servicios.forEach(s=>{

s.distribucion.forEach(d=>{

let unit=s.valor/s.totalPersonas

filas.push({

Servicio:s.nombre,
ValorServicio:s.valor,
PersonasTotales:s.totalPersonas,
Responsable:d.responsable,
PersonasResponsable:d.personas,
ValorPagar:unit*d.personas

})

})

})

let wb=XLSX.utils.book_new()
let ws=XLSX.utils.json_to_sheet(filas)

XLSX.utils.book_append_sheet(wb,ws,"Servicios")

XLSX.writeFile(wb,"DistribucionServicios.xlsx")

}

cargarDatos()

render()

</script>

</body>
</html>
