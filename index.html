<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Servicios</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:20px;
}

.section{
    background:#fff;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input,button{
    padding:6px;
    margin:5px 0;
}

button{
    cursor:pointer;
}

.tarjetas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:15px;
}

.card{
    background:#1e1e1e;
    color:#fff;
    padding:15px;
    border-radius:10px;
}

.factura{
    color:#ffb74d;
}

.distribuido{
    color:#4fc3f7;
}

.total{
    font-weight:bold;
    font-size:18px;
    color:#4caf50;
}

.x{
    color:red;
    cursor:pointer;
    font-weight:bold;
    margin-left:6px;
}

.check{
    transform:scale(0.8);
}

.resumen{
    background:#e8f5e9;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}
.diferencia{
    color:red;
}
</style>
</head>
<body>

<h2>Agregar Servicio</h2>
<div class="section">
    Servicio:
    <input type="text" id="servicioNombre">
    Valor:
    <input type="number" id="servicioValor">
    Fecha límite:
    <input type="date" id="servicioFecha">
    <button onclick="agregarServicio()">Agregar</button>
</div>

<h2>Servicios Acumulados</h2>
<div class="section" id="serviciosLista"></div>

<h2>Agregar Responsable</h2>
<div class="section">
    Nombre:
    <input type="text" id="responsableNombre">
    <button onclick="agregarResponsable()">Agregar</button>
</div>

<h2>Tarjetas</h2>
<div class="tarjetas" id="tarjetas"></div>

<h2>Resumen</h2>
<div class="resumen" id="resumen"></div>

<script>

let servicios = [];
let responsables = [];

function money(n){
    return Number(n).toLocaleString("es-CO");
}

function agregarServicio(){
    let nombre = document.getElementById("servicioNombre").value.trim().toLowerCase();
    let valor = parseFloat(document.getElementById("servicioValor").value);
    let fecha = document.getElementById("servicioFecha").value;

    if(!nombre || !valor || !fecha){
        alert("Complete todos los campos");
        return;
    }

    if(servicios.some(s=>s.nombre===nombre)){
        alert("Ese servicio ya existe");
        return;
    }

    servicios.push({nombre,valor,fecha});
    renderServicios();
    renderTarjetas();
}

function eliminarServicio(nombre){
    servicios = servicios.filter(s=>s.nombre!==nombre);

    responsables.forEach(r=>{
        delete r.personas[nombre];
    });

    renderServicios();
    renderTarjetas();
}

function renderServicios(){
    let div = document.getElementById("serviciosLista");
    div.innerHTML="";

    servicios.forEach(s=>{
        div.innerHTML += `
        <div>
            ${s.nombre.toUpperCase()} - $${money(s.valor)}
            <span class="x" onclick="eliminarServicio('${s.nombre}')">❌</span>
        </div>`;
    });
}

function agregarResponsable(){
    let nombre = document.getElementById("responsableNombre").value.trim();
    if(!nombre) return;

    responsables.push({
        nombre,
        personas:{},
        ajustes:[]
    });

    renderTarjetas();
}

function renderTarjetas(){
    let cont = document.getElementById("tarjetas");
    cont.innerHTML="";

    responsables.forEach((r,index)=>{

        let totalPagar = 0;

        let html = `<div class="card">
        <h3>${r.nombre}</h3>`;

        servicios.forEach(s=>{

            if(!r.personas[s.nombre]) r.personas[s.nombre]=0;

            html += `
            <div>
            ${s.nombre.toUpperCase()} <br>
            Personas:
            <input type="number" min="0" step="1"
            value="${r.personas[s.nombre]}"
            onchange="actualizarPersonas(${index},'${s.nombre}',this.value)">
            </div>
            `;

            let totalPersonas = totalPersonasServicio(s.nombre);

            if(totalPersonas>0){
                let unitario = s.valor / totalPersonas;
                let distribuido = unitario * r.personas[s.nombre];

                if(r.personas[s.nombre]>0){
                    totalPagar += distribuido;

                    html += `
                    <div class="factura">
                        Factura: $${money(s.valor)}
                    </div>
                    <div class="distribuido">
                        Distribuido: $${money(Math.round(distribuido/100)*100)}
                        <span class="x"
                        onclick="quitarDistribucion(${index},'${s.nombre}')">❌</span>
                    </div>
                    <div>
                        Fecha límite: ${formatoFecha(s.fecha)}
                    </div>
                    `;
                }
            }

        });

        let totalAjustes = 0;

        r.ajustes.forEach((a,i)=>{
            totalAjustes += a.valor;

            html += `
            <div>
                Ajuste: ${a.nombre} $${money(a.valor)}
                <span class="x"
                onclick="eliminarAjuste(${index},${i})">❌</span>
            </div>
            `;
        });

        totalPagar += totalAjustes;

        html += `
        <hr>
        <div>
            <input type="checkbox" class="check"
            onchange="toggleAjuste(${index},this.checked)">
            Ajuste
        </div>
        <div id="ajusteBox-${index}" style="display:none;">
            Nombre:
            <input type="text" id="ajusteNombre-${index}">
            Valor:
            <input type="number" id="ajusteValor-${index}">
            <button onclick="agregarAjuste(${index})">Agregar</button>
        </div>
        <hr>
        <div class="total">
            Total a pagar: $${money(Math.round(totalPagar/100)*100)}
        </div>
        </div>`;

        cont.innerHTML += html;
    });

    renderResumen();
}

function actualizarPersonas(index,servicio,valor){
    let num = Math.round(Number(valor));
    if(num<0) num=0;

    responsables[index].personas[servicio]=num;
    renderTarjetas();
}

function quitarDistribucion(index,servicio){
    responsables[index].personas[servicio]=0;
    renderTarjetas();
}

function totalPersonasServicio(servicio){
    let suma=0;
    responsables.forEach(r=>{
        suma += r.personas[servicio] || 0;
    });
    return suma;
}

function toggleAjuste(index,estado){
    document.getElementById("ajusteBox-"+index).style.display =
        estado ? "block" : "none";
}

function agregarAjuste(index){
    let nombre = document.getElementById("ajusteNombre-"+index).value;
    let valor = parseFloat(document.getElementById("ajusteValor-"+index).value);

    if(!nombre || !valor) return;

    responsables[index].ajustes.push({nombre,valor});
    document.getElementById("ajusteBox-"+index).style.display="none";
    renderTarjetas();
}

function eliminarAjuste(index,i){
    responsables[index].ajustes.splice(i,1);
    renderTarjetas();
}

function formatoFecha(f){
    let d = new Date(f);
    return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
}

function renderResumen(){
    let totalServicios = servicios.reduce((a,b)=>a+b.valor,0);
    let totalDistribuido = 0;
    let totalAjustes = 0;

    responsables.forEach(r=>{
        servicios.forEach(s=>{
            let totalPersonas = totalPersonasServicio(s.nombre);
            if(totalPersonas>0){
                let unitario = s.valor / totalPersonas;
                totalDistribuido += unitario * r.personas[s.nombre];
            }
        });
        totalAjustes += r.ajustes.reduce((a,b)=>a+b.valor,0);
    });

    let diferencia = totalServicios - totalDistribuido;

    document.getElementById("resumen").innerHTML = `
    Total servicios ingresados: $${money(totalServicios)} <br>
    Total distribuidos: $${money(Math.round(totalDistribuido/100)*100)} <br>
    Total ajustes: $${money(totalAjustes)} <br>
    Diferencia detectada:
    <span class="${diferencia!==0?'diferencia':''}">
    $${money(diferencia)}
    </span>
    `;
}

</script>
</body>
</html>
