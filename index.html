<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Profesional</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    margin:0;
    padding:15px;
}
.container{
    background:white;
    padding:20px;
    border-radius:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}
input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
    width:100%;
}
button{
    padding:6px 12px;
    border:none;
    border-radius:8px;
    background:#2a5298;
    color:white;
    cursor:pointer;
}
.card{
    background:#1f1f1f;
    color:white;
    padding:15px;
    border-radius:20px;
    margin-top:20px;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
th,td{
    padding:6px;
    text-align:center;
    font-size:14px;
}
th{background:#2a5298;}
.valor{color:#ff4fa3;font-weight:bold;}
.total{margin-top:10px;font-weight:bold;}
.correcto{color:green;font-weight:bold;}
.error{color:red;font-weight:bold;}
@media(max-width:768px){
    table{font-size:12px;}
}
</style>
</head>
<body>

<div class="container">

<h2>Agregar Servicio</h2>

<div class="form-grid">
<select id="servicio">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>

<input type="number" id="valor" placeholder="Valor total servicio">
<input type="date" id="fecha">

<select id="representante">
<option>Jorge Garzón</option>
<option>Jorge Balero</option>
<option>Arturo Castro</option>
<option>Ismael Garzón</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad personas">

<button onclick="agregarAsignacion()">Agregar</button>
</div>

<h3>Total Servicios Ingresados: $ <span id="totalServicios">0</span></h3>
<h3>Total Distribuido: $ <span id="totalDistribuido">0</span></h3>
<div id="estado"></div>

<div id="tarjetas"></div>

</div>

<script>

let servicios = []
let idServicio = 0

function formatear(n){
    return Math.round(n).toLocaleString("es-CO")
}

function aproximarCien(valor){
    if(valor % 100 === 0) return valor
    return Math.round(valor/100)*100
}

function agregarAsignacion(){

    let nombre = servicio.value
    let valor = parseFloat(valorInput.value)
    let fecha = fechaInput.value
    let rep = representante.value
    let cantidad = parseFloat(cantidadInput.value)

    if(!valor || !fecha || !cantidad){
        alert("Complete datos")
        return
    }

    let serv = servicios.find(s=>s.nombre===nombre)

    if(!serv){
        serv = {
            id:idServicio++,
            nombre,
            valor,
            fecha,
            asignaciones:[]
        }
        servicios.push(serv)
    }

    serv.asignaciones.push({rep,cantidad})
    render()
}

function eliminarAsignacion(servId,rep){
    let serv = servicios.find(s=>s.id===servId)
    serv.asignaciones = serv.asignaciones.filter(a=>a.rep!==rep)
    render()
}

function render(){

    let contenedor = document.getElementById("tarjetas")
    contenedor.innerHTML=""

    let reps = [...new Set(servicios.flatMap(s=>s.asignaciones.map(a=>a.rep)))]

    let totalServicios = servicios.reduce((a,b)=>a+b.valor,0)
    let totalDistribuido = 0

    reps.forEach(rep=>{

        let card = document.createElement("div")
        card.className="card"

        let html=`<h3>${rep}</h3>
        <table>
        <tr>
        <th>Servicio</th>
        <th>Valor</th>
        <th>Personas</th>
        <th>Valor Distr</th>
        <th></th>
        </tr>`

        let totalRep=0

        servicios.forEach(s=>{

            let asignacion = s.asignaciones.find(a=>a.rep===rep)
            if(!asignacion) return

            let totalPersonas = s.asignaciones.reduce((a,b)=>a+b.cantidad,0)
            let unitario = s.valor / totalPersonas
            let valorDistr = aproximarCien(unitario * asignacion.cantidad)

            totalRep += valorDistr
            totalDistribuido += valorDistr

            html+=`
            <tr>
            <td>${s.nombre}</td>
            <td>$ ${formatear(s.valor)}</td>
            <td>${asignacion.cantidad}</td>
            <td class="valor">$ ${formatear(valorDistr)}</td>
            <td><button onclick="eliminarAsignacion(${s.id},'${rep}')">Quitar</button></td>
            </tr>`
        })

        html+=`</table>`

        html+=`
        <div class="total">
        <label>
        <input type="checkbox" onchange="toggleAjuste('${rep}',this.checked)">
        Aplicar ajuste
        </label>
        <div id="ajuste-${rep}" style="display:none">
        <input type="text" placeholder="Nombre ajuste">
        <input type="number" placeholder="Valor ajuste" 
        oninput="actualizarAjuste('${rep}',this.value)">
        </div>
        </div>

        <div class="total">
        Total a pagar: $ <span id="total-${rep}">${formatear(totalRep)}</span>
        </div>
        `

        card.innerHTML=html
        contenedor.appendChild(card)
    })

    document.getElementById("totalServicios").innerText=formatear(totalServicios)
    document.getElementById("totalDistribuido").innerText=formatear(totalDistribuido)

    validar(totalServicios,totalDistribuido)
}

let ajustes = {}

function toggleAjuste(rep,estado){
    document.getElementById("ajuste-"+rep).style.display = estado?"block":"none"
}

function actualizarAjuste(rep,valor){
    ajustes[rep] = parseFloat(valor)||0
    render()
}

function validar(totalS,totalD){
    let estado = document.getElementById("estado")
    let diff = totalD-totalS
    if(diff===0){
        estado.innerHTML="✅ Cuadre Perfecto"
        estado.className="correcto"
    }else{
        estado.innerHTML="⚠ Diferencia: $ "+formatear(diff)
        estado.className="error"
    }
}

const servicio=document.getElementById("servicio")
const valorInput=document.getElementById("valor")
const fechaInput=document.getElementById("fecha")
const representante=document.getElementById("representante")
const cantidadInput=document.getElementById("cantidad")

</script>

</body>
</html>
