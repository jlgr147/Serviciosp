<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución de Recibos</title>
<style>
body{
font-family:'Segoe UI',sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}
.container{max-width:1200px;margin:auto}
.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:20px;
}
h2{margin-top:40px}
button{
background:#2563eb;
color:white;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}
button:hover{opacity:.9}
input,select{
padding:6px;
border-radius:6px;
border:1px solid #ccc;
width:100%;
margin-top:5px;
}
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}
th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:center;
font-size:14px;
}
.delete-btn{
color:red;
cursor:pointer;
font-size:13px;
}
.small-check{
transform:scale(.8);
margin-left:8px;
}
.summary{
font-weight:bold;
font-size:15px;
}
@media(max-width:768px){
table{font-size:12px}
}
</style>
</head>
<body>
<div class="container">

<h2>Agregar Servicio</h2>
<div class="card">
<select id="serviceName">
<option>Agua</option>
<option>Internet claro</option>
<option>Internet Barbosa</option>
<option>Gas</option>
<option>Luz</option>
<option>aseo</option>
<option>Seguro</option>
<option>Netfix - youtube</option>
</select>
<input type="number" id="serviceValue" placeholder="Valor del servicio">
<input type="date" id="serviceDate">
<button onclick="addService()">Agregar</button>
</div>

<h2>Representantes</h2>
<div id="representatives"></div>

<h2>Resumen General</h2>
<div class="card summary" id="summary"></div>

</div>

<script>
let services=[]
let reps=[
{nombre:"Jorge Garzón", personas:1, ajustes:{activo:false,tipo:"",valor:0}, eliminado:[]},
{nombre:"Jorge Balero", personas:1, ajustes:{activo:false,tipo:"",valor:0}, eliminado:[]},
{nombre:"Arturo Castro", personas:1, ajustes:{activo:false,tipo:"",valor:0}, eliminado:[]},
{nombre:"Ismael Garzón", personas:1, ajustes:{activo:false,tipo:"",valor:0}, eliminado:[]}
]

function format(n){
return Math.round(n).toLocaleString("es-CO")
}

function round100(n){
return Math.ceil(n/100)*100
}

function addService(){
let name=document.getElementById("serviceName").value
let value=parseFloat(document.getElementById("serviceValue").value)
let date=document.getElementById("serviceDate").value
if(!value)return
services.push({name,value,date})
document.getElementById("serviceValue").value=""
render()
}

function render(){

let totalIngresado=services.reduce((a,b)=>a+b.value,0)
let totalDistribuido=0
let totalAjustes=0

let container=document.getElementById("representatives")
container.innerHTML=""

reps.forEach((rep,ri)=>{

let card=document.createElement("div")
card.className="card"

let totalRep=0

let tabla=`
<table>
<tr>
<th>Servicio</th>
<th>Valor</th>
<th>Personas</th>
<th>Valor Distr</th>
<th></th>
</tr>`

services.forEach((s,si)=>{

if(rep.eliminado.includes(si)) return

let personasTotales=0
reps.forEach(r=>{
if(!r.eliminado.includes(si)){
personasTotales+=Math.round(r.personas)
}
})

if(personasTotales===0) return

let unitario=s.value/personasTotales
let valor=unitario*Math.round(rep.personas)

totalRep+=valor
totalDistribuido+=valor

tabla+=`
<tr>
<td>${s.name}</td>
<td>$${format(s.value)}</td>
<td>${Math.round(rep.personas)}</td>
<td>$${format(valor)}</td>
<td><span class="delete-btn" onclick="removeService(${ri},${si})">✖</span></td>
</tr>`
})

tabla+="</table>"

let ajusteHTML=`
<div style="margin-top:15px">
<label style="font-size:13px">
<input type="checkbox" class="small-check" ${rep.ajustes.activo?"checked":""}
onchange="toggleAjuste(${ri},this.checked)">
 Aplicar ajuste
</label>
<div id="ajuste-${ri}" style="display:${rep.ajustes.activo?"block":"none"};margin-top:10px">
<input placeholder="Tipo de ajuste"
value="${rep.ajustes.tipo}"
oninput="setTipo(${ri},this.value)">
<input type="number"
placeholder="Valor ajuste"
value="${rep.ajustes.valor}"
oninput="setValor(${ri},this.value)">
</div>
</div>
`

let totalFinal=totalRep

if(rep.ajustes.activo){
totalFinal+=rep.ajustes.valor
totalAjustes+=rep.ajustes.valor
}

card.innerHTML=`
<h3>${rep.nombre}</h3>
${tabla}
${ajusteHTML}
<h4>Total a pagar: $${format(round100(totalFinal))}</h4>
`

container.appendChild(card)
})

let diferencia=totalIngresado-totalDistribuido

document.getElementById("summary").innerHTML=`
Total servicios ingresados: $${format(totalIngresado)}<br>
Total servicios distribuidos: $${format(totalDistribuido)}<br>
Total ajustes: $${format(totalAjustes)}<br>
Diferencia: $${format(diferencia)}
`
}

function removeService(ri,si){
reps[ri].eliminado.push(si)
render()
}

function toggleAjuste(ri,estado){
reps[ri].ajustes.activo=estado
render()
}

function setTipo(ri,val){
reps[ri].ajustes.tipo=val
}

function setValor(ri,val){
reps[ri].ajustes.valor=parseFloat(val)||0
render()
}

render()
</script>
</body>
</html>
